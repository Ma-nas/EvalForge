name: EvalForge Keep-Alive Daemon

on:
  schedule:
    # Triggers every 12 minutes (UTC) to prevent Render's 15-minute hibernation
    - cron: '*/12 * * * *'
  workflow_dispatch:
    inputs:
      backend_url_override:
        description: 'Optional URL override to ping'
        required: false
        default: ''

jobs:
  heartbeat:
    name: Ping EvalForge Backend
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat to EvalForge Backend
        env:
          TARGET_URL: ${{ github.event.inputs.backend_url_override || secrets.BACKEND_HEALTH_URL || 'https://evalforge-backend.onrender.com/health' }}
        run: |
          echo "======================================================"
          echo " Starting EvalForge 24/7 Keep-Alive Daemon"
          echo " Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo " Target: $TARGET_URL"
          echo "======================================================"

          start_time=$(date +%s)
          http_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$TARGET_URL" || echo "FAILED")
          end_time=$(date +%s)
          duration=$((end_time - start_time))

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
            echo "✅ [EvalForge Backend] Status: $http_code (Latency: ${duration}s) - WARM & ALIVE"
          elif [ "$http_code" = "FAILED" ]; then
            echo "⚠️ [EvalForge Backend] Status: TIMEOUT / WAKING UP (Latency: ${duration}s)"
          else
            echo "ℹ️ [EvalForge Backend] Status: $http_code (Latency: ${duration}s)"
          fi
          echo "======================================================"
          echo " Heartbeat cycle complete."
