version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evalforge-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - DATABASE_URL=sqlite:////data/evalforge.db
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REQUIRE_AUTH=false
    volumes:
      - evalforge_data:/data
      - ./backend/uploads:/app/uploads
      - ./datasets:/datasets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evalforge-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped

volumes:
  evalforge_data:
    driver: local
